    <style>
        body { margin:0; font-family:'Inter', sans-serif; background: radial-gradient(circle at top, #0f172a, #020617); color:white; display:flex; flex-direction: column; align-items:center; min-height:100vh; padding: 20px; }

        button { width:100%; padding:14px; margin-top:20px; border-radius:12px; border:none; background: linear-gradient(90deg,#6366f1,#8b5cf6); color:white; font-weight:600; cursor:pointer; transition:0.2s; }

</head>
<body>
<div class="container">
    <h1>🔐 Password Gen</h1>

    <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1805732481707409" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <input type="text" id="passDisplay" readonly placeholder="Cliquer sur Générer">
    <button onclick="generate()">Générer Mot de Passe</button>

    <div class="seo-content">
        <h2>Sécurité Maximale</h2>
        <p>Nos algorithmes génèrent des combinaisons aléatoires incluant majuscules, minuscules, chiffres et symboles pour une protection optimale contre le piratage.</p>
    </div>
</div>
<script>
    function generate() {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let pass = "";
        for (let i = 0; i < 16; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById("passDisplay").value = pass;
    }
</script>
